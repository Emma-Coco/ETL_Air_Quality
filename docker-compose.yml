services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: air-quality-api
    ports:
      - "8000:8000"
    volumes:
      - air-quality-data:/data
    networks:
      - air-quality-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: air-quality-frontend
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - air-quality-network

networks:
  air-quality-network:
    driver: bridge

volumes:
  air-quality-data: