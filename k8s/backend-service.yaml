apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: air-quality
  labels:
    app: air-quality
    component: backend
spec:
  type: ClusterIP
  selector:
    app: air-quality
    component: backend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  sessionAffinity: None
